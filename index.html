    this._p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('monitorfiscalmx', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('news')) d.createObjectStore('news', { keyPath: 'id' }); if (!d.objectStoreNames.contains('backups')) d.createObjectStore('backups', { keyPath: 'date' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this._p;
  },
  async run(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction(store, mode); let rq; try { rq = fn(t.objectStore(store)); } catch (e) { rej(e); return; } t.oncomplete = () => res(rq && rq.result); t.onerror = t.onabort = () => rej(t.error); });
  },
  getAll(s) { return this.run(s, 'readonly', (o) => o.getAll()).catch(() => []); },
  put(s, v) { return this.run(s, 'readwrite', (o) => o.put(v)).catch(() => null); },
  del(s, k) { return this.run(s, 'readwrite', (o) => o.delete(k)).catch(() => null); },
  async putMany(s, arr) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction(s, 'readwrite'); const o = t.objectStore(s); arr.forEach((v) => o.put(v)); t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); }); } catch (e) {} },
};
async function mirrorBackup(data) {
  await DB.put('backups', { date: localISO(), savedAt: new Date().toISOString(), payload: data });
  const all = (await DB.getAll('backups')).sort((a, b) => b.date.localeCompare(a.date));
  for (const x of all.slice(7)) await DB.del('backups', x.date);
}

   5. MOTOR FISCAL / LABORAL COMPARTIDO
   ===================================================================== */
// ISR por periodo (tarifa mensual escalada por días/30.4) y subsidio al empleo
function isrPeriodo(gravable, dias, T) {
  const f = dias / DIAS_MES, g = Math.max(0, gravable);
  let row = T.isr[0];
  for (const r of T.isr) { if (g >= r[0] * f) row = r; else break; }
  const isr = (g - row[0] * f) * row[2] / 100 + row[1] * f;
  const sub = g <= T.subLimite * f ? T.subMonto * f : 0;
  return { isr: Math.max(0, isr), sub, neto: Math.max(0, isr - sub), pct: row[2] };
}
const isrAnual = (g, T) => isrPeriodo(g, DIAS_MES * 12, T).isr;
const vacDias = (a) => { const y = Math.max(1, Math.floor(a)); if (y <= 5) return [12, 14, 16, 18, 20][y - 1]; if (y <= 10) return 22; if (y <= 15) return 24; if (y <= 20) return 26; if (y <= 25) return 28; if (y <= 30) return 30; return 32; };
const factorInt = (anios, aguin, pv) => 1 + aguin / 365 + (vacDias(anios) * pv / 100) / 365;
const VACACIONES_TABLA = [[1, 12], [2, 14], [3, 16], [4, 18], [5, 20], ['6-10', 22], ['11-15', 24], ['16-20', 26], ['21-25', 28], ['26-30', 30], ['31-35', 32]];
function cyvPatronal(sbc, ind, T) {
  const ratio = sbc / ind.umaD; let i;
  if (sbc <= ind.smg) i = 0; else if (ratio <= 1.5) i = 1; else if (ratio <= 2) i = 2; else if (ratio <= 2.5) i = 3; else if (ratio <= 3) i = 4; else if (ratio <= 3.5) i = 5; else if (ratio <= 4) i = 6; else i = 7;
  return T.cyv[i];
}
// Cuotas IMSS obrero-patronales para `dias` días
function imssCuotas(sbc, dias, ind, T, primaRiesgo) {
  const uma = ind.umaD, s = Math.min(sbc, 25 * uma), exc = Math.max(0, s - 3 * uma), cy = cyvPatronal(s, ind, T);
  const obrero = [
    ['Enf. y Mat. excedente 3 UMA (0.40%)', exc * dias * 0.004], ['Prestaciones en dinero (0.25%)', s * dias * 0.0025],
    ['Gastos médicos pensionados (0.375%)', s * dias * 0.00375], ['Invalidez y Vida (0.625%)', s * dias * 0.00625], ['Cesantía y Vejez (1.125%)', s * dias * 0.01125],
  ];
  const patronal = [
    ['E y M cuota fija (20.40% UMA)', uma * dias * 0.204], ['E y M excedente (1.10%)', exc * dias * 0.011], ['Prestaciones en dinero (0.70%)', s * dias * 0.007],
    ['Gastos médicos pensionados (1.05%)', s * dias * 0.0105], ['Invalidez y Vida (1.75%)', s * dias * 0.0175], ['Guarderías y Prest. Sociales (1.00%)', s * dias * 0.01],
    [`Riesgo de trabajo (${fmt(primaRiesgo, 5)}%)`, s * dias * primaRiesgo / 100], ['Retiro (2.00%)', s * dias * 0.02], [`Cesantía y Vejez patronal (${fmt(cy, 3)}%)`, s * dias * cy / 100], ['Infonavit (5.00%)', s * dias * 0.05],
  ];
  const sum = (a) => a.reduce((t, x) => t + x[1], 0);
  return { sbc: s, obrero, patronal, tObrero: sum(obrero), tPatronal: sum(patronal), cyRate: cy };
}
// Excedentes de previsión social sobre SBC (Art. 27 LSS): vales 40% UMA, bonos 10% SBC
function excedentesSBC({ sdFijo, valesDia, bpDia, baDia }, ind) {
  const exV = Math.max(0, valesDia - 0.4 * ind.umaD), exP = Math.max(0, bpDia - 0.1 * sdFijo), exA = Math.max(0, baDia - 0.1 * sdFijo);
  return { exV, exP, exA, total: exV + exP + exA };
}
const irr = (flows) => {
  const npv = (r) => flows.reduce((t, c, i) => t + c / Math.pow(1 + r, i), 0);
  let lo = -0.99, hi = 10; if (npv(lo) * npv(hi) > 0) return NaN;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
};

/* ---------- 1. SBC (Art. 27 y 30 LSS) ---------- */
function CalcSBC({ ctx, toast }) {
  const { ind, T } = ctx;
  const [f, set] = useForm({ sd: '', anios: '1', aguin: '15', pv: '25', vales: '', bp: '', ba: '', varBim: '', diasBim: '61' });
  const sd = num(f.sd), fi = factorInt(num(f.anios), num(f.aguin), num(f.pv)), fijo = sd * fi;
  const variable = num(f.varBim) / (num(f.diasBim) || 61);
  const ex = excedentesSBC({ sdFijo: fijo, valesDia: num(f.vales) / DIAS_MES, bpDia: num(f.bp) / DIAS_MES, baDia: num(f.ba) / DIAS_MES }, ind);
  const bruto = fijo + variable + ex.total, sbc = Math.min(bruto, 25 * ind.umaD);
  const tipo = variable > 0 || ex.total > 0 ? 'Mixto' : 'Fijo';
  const rows = sd ? [
    ['Integración', '', 'h'], ['Días de vacaciones (LFT)', String(vacDias(num(f.anios)))], ['Factor de integración', fmt(fi, 4)], ['SBC fijo', $m(fijo), 's'],
    ['Variable y excedentes', '', 'h'], ['Variable (bimestre anterior ÷ días)', $m(variable)], ['Excedente vales (>40% UMA)', $m(ex.exV)], ['Excedente bono puntualidad (>10% SBC)', $m(ex.exP)], ['Excedente bono asistencia (>10% SBC)', $m(ex.exA)],
    ['Resultado', '', 'h'], ['SBC calculado', $m(bruto)], [`Tope 25 UMA (${$m(25 * ind.umaD)})`, bruto > 25 * ind.umaD ? 'APLICA' : 'no aplica', 'm'], [`SBC ${tipo}`, $m(sbc), 's'],
  ] : null;
  return (<div className="space-y-3">
    <Grid2><F label="Salario diario nominal" v={f.sd} set={set('sd')} prefix="$" /><F label="Antigüedad (años)" v={f.anios} set={set('anios')} /></Grid2>

  </div>);

/* ---------- 2. Simulador de Sueldo Neto ---------- */
function CalcNomina({ ctx, toast }) {
  const { ind, T } = ctx;
  const [f, set] = useForm({ sd: '', per: '15', zona: 'gral', anios: '1', aguin: '15', pv: '25', bp: '', ba: '', vales: '', grat: '', infT: 'no', infV: '', fon: '', pre: '', penT: 'no', penV: '' });
  const [ex, setEx] = useState([]);
  const upd = (i, k, v) => setEx((a) => a.map((x, j) => (j === i ? { ...x, [k]: v } : x)));
  const sd = num(f.sd), dias = num(f.per), smg = f.zona === 'zlfn' ? ind.zlfn : ind.smg;
  const sueldo = sd * dias, bp = num(f.bp), ba = num(f.ba), vales = num(f.vales), grat = num(f.grat);
  const valesE = Math.min(vales, ind.umaM * dias / DIAS_MES), valesG = vales - valesE;
  const exTot = ex.reduce((t, x) => t + num(x.m), 0);
  const exGrav = ex.reduce((t, x) => t + (x.t === 'g' ? num(x.m) : x.t === 'm' ? Math.max(0, num(x.m) - num(x.e)) : 0), 0);
  const exExen = exTot - exGrav;
  const perc = sueldo + bp + ba + vales + grat + exTot;
  const gravable = sueldo + bp + ba + grat + valesG + exGrav;
  const r = isrPeriodo(gravable, dias, T);
  const fijo = sd * factorInt(num(f.anios), num(f.aguin), num(f.pv));
  const exSBC = excedentesSBC({ sdFijo: fijo, valesDia: vales / dias, bpDia: bp / dias, baDia: ba / dias }, ind);

  const fon = num(f.fon), pre = num(f.pre);

  const ded = r.neto + im.tObrero + inf + fon + pre + pen, neto = perc - ded;

    ['Total percepciones', $m(perc), 's'], ['Gravado ISR / Exento', `${$m(gravable)} / ${$m(valesE + exExen)}`, 'm'],
    ['Deducciones', '', 'h'], ['ISR (tarifa Art. 96)', $m(r.isr)], ['(−) Subsidio al empleo', r.sub ? '−' + $m(Math.min(r.sub, r.isr)) : '$0.00'], ['ISR retenido', $m(r.neto)],
    ...im.obrero.map(([l, v]) => ['IMSS · ' + l, $m(v), 'm']), ['IMSS obrero total', $m(im.tObrero)],
    ...(inf ? [['Infonavit', $m(inf)]] : []), ...(fon ? [['Fonacot', $m(fon)]] : []), ...(pre ? [['Préstamo empresa', $m(pre)]] : []), ...(pen ? [['Pensión alimenticia', $m(pen)]] : []),
    ['Total deducciones', $m(ded), 's'], ['SBC utilizado', $m(sbc), 'm'], ['SUELDO NETO', $m(neto), 's'],
  ] : null;
  return (<div className="space-y-3">
    <Grid2><F label="Sueldo diario" v={f.sd} set={set('sd')} prefix="$" /><S label="Periodicidad" v={f.per} set={set('per')} options={[['7', 'Semanal (7)'], ['14', 'Catorcenal (14)'], ['15', 'Quincenal (15)'], ['30.4', 'Mensual (30.4)']]} /></Grid2>
    <S label="Zona salarial" v={f.zona} set={set('zona')} options={[['gral', 'Zona General'], ['zlfn', 'Zona Libre Frontera Norte']]} />
    {sd > 0 && sd < smg && <Note tone="rose">El sueldo diario es menor al salario mínimo vigente ({$m(smg)}).</Note>}
    <Grid2><F label="Antigüedad (años)" v={f.anios} set={set('anios')} /><F label="Días aguinaldo" v={f.aguin} set={set('aguin')} /></Grid2>
    <F label="% Prima vacacional" v={f.pv} set={set('pv')} suffix="%" />
    <H>Percepciones del periodo</H>
    <Grid2><F label="Bono puntualidad" v={f.bp} set={set('bp')} prefix="$" /><F label="Bono asistencia" v={f.ba} set={set('ba')} prefix="$" /></Grid2>
    <Grid2><F label="Vales de despensa" v={f.vales} set={set('vales')} prefix="$" /><F label="Gratificaciones" v={f.grat} set={set('grat')} prefix="$" /></Grid2>
    {ex.map((x, i) => (
      <div key={i} className="rounded-xl border border-slate-200 p-3 space-y-2 bg-slate-50">
        <div className="flex gap-2"><input className={inputCls} placeholder="Concepto (ej. Comisión)" value={x.n} onChange={(e) => upd(i, 'n', e.target.value)} />

/* ---------- 4. Liquidación e indemnización ---------- */
function CalcLiquidacion({ ctx, toast }) {
  const { ind, T } = ctx;
  const [f, set] = useForm({ sd: '', ing: '', baj: localISO(), tipo: 'despido', v20: false, aguin: '15', pv: '25', vacPend: '', salPend: '', otros: '', zona: 'gral' });
  const sd = num(f.sd), a = new Date(f.ing), b = new Date(f.baj);
  const ok = sd > 0 && !isNaN(a) && !isNaN(b) && b >= a;
  let rows = null;
  if (ok) {
    const anios = (b - a) / 864e5 / 365.25, aniosEnt = Math.floor(anios), frac = anios - aniosEnt;
    const aniosISR = Math.max(1, aniosEnt + (frac > 0.5 ? 1 : 0));
    const sdi = sd * factorInt(Math.max(1, aniosEnt), num(f.aguin), num(f.pv));
    const smg = f.zona === 'zlfn' ? ind.zlfn : ind.smg;
    const indem = f.tipo === 'despido' ? 90 * sdi : 0;
    const v20 = f.tipo === 'despido' && f.v20 ? 20 * anios * sdi : 0;
    const pa = (f.tipo === 'despido' || (f.tipo === 'renuncia' && anios >= 15)) ? 12 * Math.min(sd, 2 * smg) * anios : 0;
    const ini = new Date(b.getFullYear(), 0, 1), desde = a > ini ? a : ini, diasAnio = Math.min(366, Math.round((b - desde) / 864e5) + 1);
    const agui = sd * num(f.aguin) * diasAnio / 365;
    const ult = new Date(a); ult.setFullYear(b.getFullYear()); if (ult > b) ult.setFullYear(b.getFullYear() - 1);
    const diasServ = Math.max(0, Math.round((b - ult) / 864e5));
    const vacPr = sd * vacDias(Math.max(1, aniosEnt + 1)) * diasServ / 365, vacPen = sd * num(f.vacPend);
    const pvac = (vacPr + vacPen) * num(f.pv) / 100, sal = sd * num(f.salPend), otros = num(f.otros);
    const sep = indem + v20 + pa, exSep = Math.min(sep, 90 * ind.umaD * aniosISR), grSep = sep - exSep;
    const sueldoM = sd * DIAS_MES;
    let isrSep = 0, tasa = 0;
    if (grSep > 0) { const cociente = grSep / aniosISR; const dif = isrPeriodo(sueldoM + cociente, DIAS_MES, T).isr - isrPeriodo(sueldoM, DIAS_MES, T).isr; tasa = dif / cociente; isrSep = grSep * tasa; }
    const exAg = Math.min(agui, 30 * ind.umaD), exPv = Math.min(pvac, 15 * ind.umaD);
    const ordGrav = (agui - exAg) + (pvac - exPv) + vacPr + vacPen + sal + otros;
    const isrOrd = Math.max(0, isrPeriodo(sueldoM + ordGrav, DIAS_MES, T).isr - isrPeriodo(sueldoM, DIAS_MES, T).isr);
    const total = sep + agui + vacPr + vacPen + pvac + sal + otros, isrT = isrSep + isrOrd;
    rows = [
      ['Antigüedad', '', 'h'], ['Años de servicio', fmt(anios, 2)], ['Años para exención (>6 meses = 1)', String(aniosISR)], ['Salario diario integrado', $m(sdi)],
      ['Separación', '', 'h'], ...(indem ? [['Indemnización constitucional 90 días', $m(indem)]] : []), ...(v20 ? [['20 días por año', $m(v20)]] : []), ['Prima de antigüedad (12 d/año, tope 2 SM)', $m(pa)], ['Subtotal separación', $m(sep), 's'],
      ['Partes proporcionales', '', 'h'], [`Aguinaldo (${diasAnio} días)`, $m(agui)], ['Vacaciones proporcionales + pendientes', $m(vacPr + vacPen)], ['Prima vacacional', $m(pvac)], ...(sal ? [['Salarios pendientes', $m(sal)]] : []), ...(otros ? [['Otros conceptos', $m(otros)]] : []),
      ['ISR (Art. 93 XIII, 95, 96 LISR)', '', 'h'], [`Exento (90 UMA × ${aniosISR})`, $m(exSep)], ['Gravable por separación', $m(grSep)], ['Tasa media aplicable', pc(tasa * 100)], ['ISR por separación', $m(isrSep)], ['ISR partes ordinarias (aprox.)', $m(isrOrd)],
      ['Resultado', '', 'h'], ['Total bruto', $m(total)], ['(−) ISR total', $m(isrT)], ['TOTAL NETO A PAGAR', $m(total - isrT), 's'],
    ];
  }
  return (<div className="space-y-3">
    <Grid2><F label="Salario diario" v={f.sd} set={set('sd')} prefix="$" /><S label="Zona" v={f.zona} set={set('zona')} options={[['gral', 'General'], ['zlfn', 'ZLFN']]} /></Grid2>
    <Grid2><F label="Fecha de ingreso" type="date" v={f.ing} set={set('ing')} /><F label="Fecha de baja" type="date" v={f.baj} set={set('baj')} /></Grid2>
    <S label="Tipo de terminación" v={f.tipo} set={set('tipo')} options={[['despido', 'Despido injustificado'], ['renuncia', 'Renuncia voluntaria'], ['mutuo', 'Mutuo acuerdo / otras']]} />
    {f.tipo === 'despido' && <Chk label="Incluir 20 días por año (no reinstalación, Art. 50)" v={f.v20} set={set('v20')} />}
    <Grid2><F label="Días aguinaldo" v={f.aguin} set={set('aguin')} /><F label="% Prima vacacional" v={f.pv} set={set('pv')} suffix="%" /></Grid2>
    <Grid2><F label="Vacaciones pendientes (días)" v={f.vacPend} set={set('vacPend')} /><F label="Salarios pendientes (días)" v={f.salPend} set={set('salPend')} /></Grid2>
    <F label="Otros conceptos gravables" v={f.otros} set={set('otros')} prefix="$" />
    {rows ? <Res title="Liquidación / Indemnización" rows={rows} toast={toast} /> : <Note>Captura salario diario y fechas válidas de ingreso y baja.</Note>}
    <Note>Cálculo orientativo. Prima de antigüedad por renuncia solo con 15+ años. Validar con asesoría laboral antes de pagar o firmar convenio.</Note>
  </div>);
}

/* ---------- 5. Horas extra y días festivos ---------- */

  const ac = num(f.ac), pcr = num(f.pcir), inv = num(f.inv);
  const raz = ac && pcr ? [['Liquidez corriente (AC ÷ PC)', fmt(ac / pcr, 2) + ' veces', 's'], ['Capital de trabajo (AC − PC)', $m(ac - pcr), 's'], ...(inv ? [['Prueba ácida ((AC − inventarios) ÷ PC)', fmt((ac - inv) / pcr, 2) + ' veces']] : [])] : null;

const BX_URL = 'https://www.banxico.org.mx/SieAPIRest/service/v1/series/SF43718,SF43783,SP68257,SP1/datos/oportuno';
const BX_MAP = { SF43718: 'usd', SF43783: 'tiie', SP68257: 'udi', SP1: 'inpc' };
async function fetchBanxico(token) {
  const attempts = [
    ['directo', () => fetch(BX_URL, { headers: { 'Bmx-Token': token, Accept: 'application/json' } })],
    ['proxy corsproxy', () => fetch('https://corsproxy.io/?url=' + encodeURIComponent(BX_URL + '?token=' + token))],
    ['proxy allorigins', () => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(BX_URL + '?token=' + token))],
  ];
  let lastErr = 'sin respuesta';
  for (const [name, fn] of attempts) {
    try {
      const r = await fn(); if (!r.ok) { lastErr = `${name}: HTTP ${r.status}`; continue; }
      const j = await r.json(); if (j && j.bmx && j.bmx.series) return { json: j, via: name };
      lastErr = `${name}: respuesta inesperada`;
    } catch (e) { lastErr = `${name}: ${e.message || 'error de red'}`; }
  }
  throw new Error(lastErr);
}
function parseBanxico(j) {
  const out = {};
  for (const s of j.bmx.series) {
    const k = BX_MAP[s.idSerie]; const d = s.datos && s.datos[s.datos.length - 1]; if (!k || !d) continue;
    const val = parseFloat(String(d.dato).replace(/,/g, '')); if (isNaN(val)) continue;
    out[k] = { val, fecha: d.fecha };
  }
  return out;
}
async function fetchFeed(feed) {
  const r = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url));
  const j = await r.json(); if (j.status !== 'ok') throw new Error(j.message || 'feed no disponible');
  return (j.items || []).slice(0, 25).map((it) => {
    let title = stripHtml(it.title), source = feed.name.replace(/^Google News · /, '');
    if (feed.url.indexOf('news.google.com') > -1) { const m = title.match(/^(.*) - ([^-]+)$/); if (m) { title = m[1]; source = m[2]; } }
    const date = new Date((it.pubDate || '').replace(' ', 'T') + 'Z');
    return { id: hashStr(it.link || it.guid || title), title, link: it.link, source, cat: feed.cat, date: isNaN(date) ? new Date().toISOString() : date.toISOString(), desc: stripHtml(it.description || it.content || '').slice(0, 260), thumb: it.thumbnail || '' };
  });
}

  const adj = (d) => { const w = d.getDay(); if (w === 6) d.setDate(d.getDate() + 2); else if (w === 0) d.setDate(d.getDate() + 1); return d; };
  for (let y = y0 - 1; y <= y0 + 1; y++) for (const o of OBLIG) {
    const push = (mo, day) => { const dt = adj(new Date(y, mo - 1, day)); out.push({ key: o.id + '|' + localISO(dt), id: o.id, cat: o.cat, n: o.n, date: localISO(dt) }); };
    if (o.r.t === 'm') for (let m = 1; m <= 12; m++) push(m, o.r.day);
    else if (o.r.t === 'm2') for (let m = 1; m <= 12; m++) push(m, o.r.day);
    else if (o.r.t === 'list') o.r.months.forEach((m) => push(m, o.r.day));
    else push(o.r.month, o.r.day);
  }
  return out;
}
const diasHasta = (iso) => Math.round((new Date(iso + 'T00:00:00') - new Date(localISO() + 'T00:00:00')) / 864e5);

        <Note>● verde = Banxico · ● ámbar = manual · ● gris = valor de referencia. Al cambiar UMA diaria se recalculan UMA mensual (×30.4), anual (mensual×12) y UMI. Verifica los valores oficiales vigentes (DOF/INEGI/CONASAMI/Infonavit).</Note>
      </Sec>

      <Sec icon="Table2" title="Tarifas y parámetros">
        <div className="overflow-x-auto"><table className="t w-full"><thead className="bg-slate-100 text-slate-600"><tr><th>Límite inf. mensual</th><th>Cuota fija</th><th>% excedente</th></tr></thead>
          <tbody>{T.isr.map((r, i) => <tr key={i} className="border-t border-slate-100">{r.map((c, j) => <td key={j}><NumCell v={c} w="w-28" onCommit={(v) => setT({ isr: T.isr.map((x, ii) => (ii === i ? x.map((y, jj) => (jj === j ? v : y)) : x)) })} /></td>)}</tr>)}</tbody></table></div>
        <Grid2>
          <label className="block"><span className="text-[12px] text-slate-600">Subsidio empleo mensual</span><NumCell v={T.subMonto} w="w-full" onCommit={(v) => setT({ subMonto: v })} /></label>
          <label className="block"><span className="text-[12px] text-slate-600">Límite ingreso subsidio</span><NumCell v={T.subLimite} w="w-full" onCommit={(v) => setT({ subLimite: v })} /></label>
          <label className="block"><span className="text-[12px] text-slate-600">Prima riesgo default %</span><NumCell v={T.primaRiesgo} w="w-full" onCommit={(v) => setT({ primaRiesgo: v })} /></label>
          <label className="block"><span className="text-[12px] text-slate-600">ISN estatal default %</span><NumCell v={T.isn} w="w-full" onCommit={(v) => setT({ isn: v })} /></label>
          <label className="block"><span className="text-[12px] text-slate-600">Seguro vivienda Infonavit $/mes</span><NumCell v={T.seguroViv} w="w-full" onCommit={(v) => setT({ seguroViv: v })} /></label>
        </Grid2>
        <div><div className="text-[12px] font-semibold text-slate-600 mb-1">Cesantía y Vejez patronal {T.cyvAnio} (% por rango: SM, 1.5, 2, 2.5, 3, 3.5, 4 UMA, +4)</div>
          <div className="grid grid-cols-4 gap-2">{T.cyv.map((c, i) => <NumCell key={i} v={c} w="w-full" onCommit={(v) => setT({ cyv: T.cyv.map((x, j) => (j === i ? v : x)) })} />)}</div></div>
        <div><div className="text-[12px] font-semibold text-slate-600 mb-1">Topes de deducibilidad</div>
          <Grid2>{Object.entries({ autoComb: 'Auto combustión', autoElec: 'Auto eléctrico', arrComb: 'Arrend. diario comb.', arrElec: 'Arrend. diario elec.', alimNac: 'Alimentos nac./día', alimExt: 'Alimentos ext./día', hospNac: 'Hospedaje nac./día', hospExt: 'Hospedaje ext./día' }).map(([k, l]) =>
            <label key={k} className="block"><span className="text-[12px] text-slate-600">{l}</span><NumCell v={T.topes[k]} w="w-full" onCommit={(v) => setT({ topes: { ...T.topes, [k]: v } })} /></label>)}</Grid2></div>
        <Btn kind="ghost" className="w-full" onClick={() => { if (confirm('¿Restablecer tarifas y parámetros a los valores de referencia?')) patch({ T: DEFAULT_T }); }}>Restablecer tarifas de referencia</Btn>
        <Note tone="amber">Tarifas ISR, subsidio, cuotas y topes son valores de referencia 2026 incluidos en la app; es responsabilidad del usuario validarlos contra DOF, Anexo 8 RMF e IMSS.</Note>
      </Sec>

      <Sec icon="Rss" title="Fuentes de noticias (RSS)">
        {data.feeds.map((f) => (
          <div key={f.id} className="flex items-center gap-2">
            <button onClick={() => patch((d) => ({ feeds: d.feeds.map((x) => (x.id === f.id ? { ...x, on: !x.on } : x)) }))} className={`w-11 h-11 rounded-xl shrink-0 flex items-center justify-center ${f.on ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-400'}`}><Icon name="Check" size={18} /></button>
            <div className="flex-1 min-w-0"><div className="text-sm font-semibold truncate">{f.name}</div><div className="text-[11px] text-slate-500 truncate">{CAT_LABEL[f.cat]} · {f.url}</div></div>
            <button onClick={() => patch((d) => ({ feeds: d.feeds.filter((x) => x.id !== f.id) }))} className="w-9 h-9 text-rose-500"><Icon name="Trash2" size={18} /></button>
          </div>))}
        <div className="rounded-xl bg-slate-50 p-3 space-y-2">
          <F label="Nombre" type="text" ph="Mi fuente" v={nf.name} set={(v) => setNf({ ...nf, name: v })} />
          <F label="URL del RSS" type="text" ph="https://…/rss.xml" v={nf.url} set={(v) => setNf({ ...nf, url: v })} />
          <S label="Categoría" v={nf.cat} set={(v) => setNf({ ...nf, cat: v })} options={NEWS_CATS.slice(1)} />
          <Btn kind="dark" icon="Plus" className="w-full" onClick={() => { if (!/^https?:\/\//.test(nf.url)) return toast('URL inválida'); patch((d) => ({ feeds: [...d.feeds, { id: uid(), name: nf.name || nf.url, url: nf.url.trim(), cat: nf.cat, on: true }] })); setNf({ name: '', url: '', cat: 'fiscal' }); toast('Fuente agregada'); }}>Agregar fuente</Btn>
        </div>
        <Btn kind="ghost" className="w-full" onClick={() => patch({ feeds: DEFAULT_FEEDS })}>Restaurar fuentes originales</Btn>
      </Sec>

      <Sec icon="HardDriveDownload" title="Respaldo y restauración">
        <div className="text-xs text-slate-500">Último respaldo externo: <b>{fmtDT(data.lastExternalBackup)}</b></div>
        <Btn kind="green" icon="Share2" className="w-full" onClick={doBackup}>Guardar respaldo en Drive</Btn>
        <Btn kind="ghost" icon="Upload" className="w-full" onClick={() => fileRef.current.click()}>Restaurar desde archivo (.json)</Btn>
        <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={onFile} />
        <div><div className="text-[12px] font-semibold text-slate-600 mb-1">Copia espejo interna (IndexedDB · últimos 7 días)</div>
          {mirrors.length ? mirrors.map((b) => <div key={b.date} className="flex items-center justify-between py-1.5 border-b border-slate-100 text-sm"><span>{b.date} <span className="text-xs text-slate-400">{new Date(b.savedAt).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}</span></span><button className="text-sky-700 font-semibold min-h-[40px] px-2" onClick={() => restore(b.payload, 'la copia del ' + b.date)}>Restaurar</button></div>) : <div className="text-xs text-slate-400">Aún no hay copias.</div>}
          <button onClick={reloadMirrors} className="text-xs text-slate-500 mt-1 underline">Actualizar lista</button></div>
        <Note>El respaldo incluye tu token Banxico: guarda el archivo en un lugar privado. En el celular, “Compartir” abre el menú nativo para elegir Google Drive o WhatsApp.</Note>
      </Sec>

      <Sec icon="Info" title="Acerca de">
        <p className="text-sm text-slate-600">MonitorFiscalMX · PWA autocontenida. Datos solo en tu dispositivo (localStorage + IndexedDB). Las calculadoras son herramientas de apoyo y no sustituyen el criterio profesional ni la normatividad vigente.</p>
        <Btn kind="danger" icon="Trash2" className="w-full" onClick={() => { if (confirm('Esto borrará TODOS los datos locales de la app (se conservan las copias espejo). ¿Continuar?')) { setData(mergeData(DEFAULT_DATA, {})); toast('Datos reiniciados'); } }}>Borrar datos locales</Btn>
      </Sec>
    </div>
  );
}

/* =====================================================================
   11b. ASISTENTE FISCAL Y FINANCIERO — motor local (RAG por relevancia, sin APIs ni costo)
   Fuentes: (1) base de conocimiento legal + criterios propios, (2) notas y noticias guardadas,
   (3) indicadores vigentes, (4) agenda de vencimientos.
   Para ampliar la base precargada agrega una ficha a KB_BASE o usa "+ Nuevo Criterio" en la app.
   Plantillas en las fichas: {umaD} {umaM} {umaA} {smg} {zlfn} {umi} {usd} {mora} {pror} {vales40M} {ag30} {pv15} {sep90} {ex5} {t25} {t3}
   ===================================================================== */
const KB_CATS = ['LISR', 'LIVA', 'CFF', 'LFT', 'LSS/IMSS', 'Infonavit', 'Contabilidad', 'Otros'];
const KB_BASE = [
  // ---------------- LFT ----------------
  { id: 'lft-vac', cat: 'LFT', t: 'Vacaciones dignas y prima vacacional', kw: 'vacaciones dignas dias prima vacacional 12 dias antiguedad 25%', fund: 'Arts. 76, 78, 79, 80 y 81 LFT',
    txt: `Primer año: 12 días laborables; aumenta 2 días por año hasta 20 (5° año); después 2 días cada 5 años (6-10: 22, 11-15: 24, 16-20: 26, 21-25: 28, 26-30: 30, 31-35: 32). No pueden compensarse con dinero (Art. 79, salvo terminación de la relación) y deben disfrutarse dentro de los 6 meses siguientes al año de servicios (Art. 81). La prima vacacional mínima es 25% del salario de los días de vacaciones (Art. 80). Ejemplo: 3 años de antigüedad = 16 días; con sueldo diario de $500 y prima 25%: 16×500×25% = $2,000 de prima.` },
  { id: 'lft-aguinaldo', cat: 'LFT', t: 'Aguinaldo: días mínimos, plazo y proporcional', kw: 'aguinaldo 15 dias 20 diciembre proporcional gratificacion anual', fund: 'Art. 87 LFT; Art. 93 fr. XIV LISR',
    txt: `Mínimo 15 días de salario, pagado antes del 20 de diciembre. Si el trabajador laboró menos de un año, recibe la parte proporcional por los días trabajados. Fórmula: salario diario × días de aguinaldo × (días trabajados en el año ÷ 365). En ISR está exento hasta 30 UMA ({ag30} con la UMA vigente); el excedente es gravable. Ejemplo: sueldo $400 diarios, 15 días, año completo = $6,000 (exento por ser menor a {ag30}).` },
  { id: 'lft-ptu', cat: 'LFT', t: 'PTU: reparto de utilidades', kw: 'ptu utilidades reparto 10% tope tres meses participacion', fund: 'Arts. 117-131 LFT; Art. 93 fr. XIV LISR; Art. 10 LISR',
    txt: `Se reparte el 10% de la renta gravable de la empresa: 50% por días trabajados y 50% por salarios devengados. Tope individual: 3 meses de salario o el promedio de la PTU recibida en los últimos 3 años, lo que más beneficie (Art. 127 fr. VIII). Se paga dentro de los 60 días siguientes a la fecha límite de la declaración anual: normalmente hasta el 30 de mayo (personas morales) y 29 de junio (personas físicas). Exento de ISR hasta 15 UMA ({pv15}). No se paga a directores, administradores ni gerentes generales.` },
  { id: 'lft-extra', cat: 'LFT', t: 'Horas extra: pago y exención de ISR', kw: 'horas extra tiempo extraordinario doble triple exencion 50% 5 uma semana', fund: 'Arts. 66-68 LFT; Art. 93 fr. I LISR',
    txt: `Las horas extra no pueden exceder 3 horas diarias ni 3 veces por semana; se pagan al 100% adicional (doble). Lo que exceda de 9 horas semanales se paga al 200% adicional (triple) y es totalmente gravado. ISR: está exento el 50% del pago por tiempo extra (sin exceder 5 UMA por semana: {ex5} con la UMA vigente); las horas fuera de los límites legales son gravadas. Ejemplo: 6 horas dobles con sueldo de $400/día (jornada 8 h): valor hora $50 → 6×50×2 = $600; exento 50% = $300 (menor al tope).` },
  { id: 'lft-jornada', cat: 'LFT', t: 'Jornada, descanso semanal, prima dominical y días festivos', kw: 'jornada diurna nocturna mixta descanso semanal domingo prima dominical festivo pago doble 25%', fund: 'Arts. 58-61, 69, 71 y 75 LFT',
    txt: `Jornada máxima: diurna 8 h, nocturna 7 h, mixta 7.5 h. Por cada 6 días de trabajo, 1 de descanso con goce de sueldo (Art. 69). Prima dominical: 25% adicional sobre el salario de un día ordinario si labora en domingo (Art. 71). Si labora en día de descanso semanal o festivo obligatorio (Art. 74, ej. 1 ene, primer lunes de feb, 1 may, 16 sep, 20 nov, 1 dic de cada 6 años, 25 dic), recibe además de su salario un pago doble: en total triple (Art. 73 y 75).` },
  { id: 'lft-liq', cat: 'LFT', t: 'Finiquito vs. liquidación e indemnización constitucional', kw: 'finiquito liquidacion indemnizacion despido injustificado 90 dias 20 dias por año separacion', fund: 'Arts. 48, 50, 87, 162 LFT',
    txt: `Finiquito (renuncia o término): partes proporcionales de aguinaldo, vacaciones y prima vacacional, y salarios pendientes. Liquidación por despido injustificado: finiquito + indemnización de 3 meses (90 días de salario integrado, Art. 48 y 50) + 20 días por año de servicios si el patrón no reinstala (Art. 50 fr. II) + prima de antigüedad (12 días por año con tope de 2 SMG, Art. 162). Salarios vencidos: hasta 12 meses y luego intereses del 2% mensual sobre 15 meses de salario (Art. 48). Ejemplo: SDI $600 → 90×600 = $54,000 de indemnización de 3 meses.` },
  { id: 'lft-pa', cat: 'LFT', t: 'Prima de antigüedad', kw: 'prima antiguedad 12 dias por año doble salario minimo 15 años renuncia', fund: 'Art. 162 LFT',

  { id: 'lft-subcon', cat: 'LFT', t: 'Subcontratación y servicios especializados (REPSE)', kw: 'subcontratacion outsourcing repse servicios especializados icsoe sisub registro', fund: 'Arts. 12-15 LFT; Art. 15-A a 15-D LSS',
    txt: `Desde 2021 está prohibida la subcontratación de personal. Solo se permiten servicios especializados u obras especializadas que no formen parte del objeto social ni de la actividad económica preponderante del contratante, con registro en el REPSE (STPS). Los prestadores presentan cuatrimestralmente el ICSOE (IMSS) y el SISUB (Infonavit), en enero, mayo y septiembre. Sin REPSE vigente, el IVA y la deducción del servicio pueden rechazarse (Art. 27 fr. XVIII LISR; Art. 5 fr. II LIVA).` },
  { id: 'lft-desc', cat: 'LFT', t: 'Descuentos permitidos al salario: Fonacot, préstamos y pensión alimenticia', kw: 'descuentos salario fonacot prestamo empresa pension alimenticia embargo retencion', fund: 'Art. 110 LFT; Ley del Fonacot',
    txt: `Solo se pueden descontar conceptos limitados en la ley: deudas con el patrón por anticipos o pagos en exceso, cuotas sindicales, pensión alimenticia ordenada por autoridad competente, créditos Infonavit y Fonacot (hasta el 20% del salario, Art. 110 fr. VI/Art. 97 LFT). Los descuentos por deudas con el patrón no pueden exceder el monto del salario de un mes y se hacen en un máximo del 30% del excedente del salario mínimo. La pensión alimenticia se fija por el juez como % del ingreso neto o monto fijo.` },
  { id: 'lss-vales', cat: 'LSS/IMSS', t: 'Vales de despensa: tope para SBC e ISR', kw: 'vales despensa tope 40% uma previsión social exento sbc excedente integra', fund: 'Art. 27 fr. VI LSS; Arts. 7 y 28 fr. XXX LISR',
    txt: `Las despensas (vales, tarjeta electrónica o especie) no integran al SBC mientras su monto mensual no rebase el 40% de la UMA mensual: hoy {vales40M}. Si otorgas más, el excedente se suma al SBC (SBC mixto). En ISR son previsión social: están exentas hasta 1 UMA anual elevada al año por trabajador si su ingreso rebasa 1 SMG anual (Art. 7 LISR), y su deducibilidad para la empresa se limita al 53% (47% si la proporción de prestaciones exentas no disminuyó respecto al ejercicio anterior; Art. 28 fr. XXX). Ejemplo: vales de $2,000 al mes con tope de {vales40M} → el excedente de $2,000 − tope integra al SBC.` },
  // ---------------- LISR ----------------
  { id: 'isr-sueldos', cat: 'LISR', t: 'Retención de ISR a sueldos y subsidio para el empleo', kw: 'retencion isr sueldos salarios tarifa subsidio empleo nomina mensual', fund: 'Arts. 96 y 99 LISR; Decreto del subsidio para el empleo',
    txt: `El patrón retiene el ISR aplicando al ingreso gravable del periodo la tarifa del Art. 96 (límite inferior, cuota fija y % sobre el excedente), escalada por los días del periodo, y resta el subsidio para el empleo cuando el ingreso mensual no rebasa el límite del decreto. Debe timbrar CFDI de nómina (Art. 99 fr. III) y enterar las retenciones a más tardar el día 17 del mes siguiente. Esta app calcula con las tarifas de Ajustes. Ejemplo (mensual): ingreso gravable $10,000 → (10,000 − 7,168.52) × 10.88% + 420.95 = $729.02 de ISR antes de subsidio.` },
  { id: 'isr-separ', cat: 'LISR', t: 'ISR por separación (indemnización y prima de antigüedad)', kw: 'isr separacion indemnizacion finiquito 90 uma por año exento gravable ultimo sueldo mensual', fund: 'Arts. 93 fr. XIII, 95 y 96 LISR',
    txt: `Exento: 90 UMA por cada año de servicio o fracción mayor de 6 meses ({sep90} por año con la UMA vigente). El excedente es gravable: se divide entre los años de servicio, el cociente se suma al último sueldo mensual ordinario, se aplica la tarifa del Art. 96, se resta el ISR del sueldo mensual y la diferencia entre el cociente da la tasa media que se aplica al total gravable. Ejemplo: 5 años de servicio → exentos 5 × 90 UMA.` },
  { id: 'isr-autos', cat: 'LISR', t: 'Deducción de automóviles: tope de inversión y arrendamiento', kw: 'automovil auto coche vehiculo deduccion tope 175000 250000 electrico arrendamiento 200 diarios', fund: 'Art. 36 fr. II y Art. 28 fr. XIII LISR',
    txt: `Compra: solo es deducible el monto original hasta $175,000 ($250,000 en autos eléctricos o híbridos), depreciado al 25% anual. El IVA acreditable se limita en la misma proporción. Arrendamiento: tope diario de $200 (autos de combustión) o $850 (eléctricos/híbridos), según la ley vigente; si pagas más, solo deduces proporcionalmente. Ejemplo: auto de $300,000 → proporción deducible 175,000/300,000 = 58.33% y el IVA acreditable también 58.33%. Valida los topes en Ajustes.` },
  { id: 'isr-viaticos', cat: 'LISR', t: 'Viáticos, hospedaje y alimentación: topes', kw: 'viaticos hospedaje alimentacion viaje tope diario nacional extranjero deduccion', fund: 'Art. 28 fr. V LISR',

  { id: 'isr-requisitos', cat: 'LISR', t: 'Requisitos de las deducciones autorizadas', kw: 'requisitos deducciones estrictamente indispensable cfdi pago efectivo 2000 medios electronicos', fund: 'Arts. 25, 27 y 28 LISR; Art. 29 y 29-A CFF',

  { id: 'isr-resico', cat: 'LISR', t: 'RESICO personas físicas: tasas y retención', kw: 'resico regimen simplificado confianza tasas 1% 2.5% 1.25 retencion limite 3.5 millones', fund: 'Arts. 113-E a 113-J LISR',

  { id: 'isr-dep', cat: 'LISR', t: 'Depreciación fiscal y actualización de la inversión', kw: 'depreciacion deduccion inversion moi activos fijos porcentaje maximo actualizacion inpc 30% computo 25% autos 10%', fund: 'Arts. 31-37 LISR (tasas Art. 34; actualización Art. 37)',
    txt: `La deducción de inversiones se hace en línea recta aplicando tasas máximas anuales sobre el monto original (MOI): construcciones 5%, mobiliario y equipo de oficina 10%, equipo de cómputo 30%, automóviles 25%, maquinaria 10% (varía por actividad). En el ejercicio de adquisición se deduce proporcionalmente por meses (mitad del mes en que se adquiere). La deducción se actualiza con el factor INPC de la mitad del periodo ÷ INPC del mes de adquisición. Ejemplo: equipo de cómputo $50,000 → $15,000 anuales sin actualizar.` },

  { id: 'isr-donat', cat: 'LISR', t: 'Donativos deducibles', kw: 'donativos deduccion donataria autorizada 7% utilidad fiscal', fund: 'Art. 27 fr. I LISR; Arts. 82-83 LISR',

      </main>

      <nav className="bg-white border-t border-slate-200 shrink-0 safe-bottom"><div className="grid grid-cols-5">
        {TABS.map(([k, l, ic]) => <button key={k} onClick={() => { if (k === tab && k === 'calc') setCalcKey((x) => x + 1); setTab(k); }} className={`h-16 flex flex-col items-center justify-center gap-0.5 ${tab === k ? 'text-sky-700' : 'text-slate-400'}`}><span className={`px-4 py-1 rounded-full ${tab === k ? 'bg-sky-100' : ''}`}><Icon name={ic} size={22} /></span><span className="text-[10.5px] font-semibold">{l}</span></button>)}
      </div></nav>

      {!asist && <button onClick={() => setAsist(true)} className="absolute right-3 z-40 w-12 h-12 rounded-full bg-slate-900/90 text-sky-300 shadow-lg border border-slate-700 flex items-center justify-center" style={{ bottom: 'calc(64px + env(safe-area-inset-bottom) + 12px)' }} aria-label="Asistente Fiscal y Financiero"><Icon name="Bot" size={22} /></button>}
      {asist && <Asistente data={data} patch={patch} toast={toast} onClose={() => setAsist(false)} />}

      {msg && <div className="fixed left-0 right-0 bottom-24 flex justify-center px-4 z-[60] pointer-events-none fadein"><div className="bg-slate-900 text-white text-sm px-4 py-3 rounded-xl shadow-lg max-w-sm text-center">{msg}</div></div>}

      {eInd && <Sheet title={eInd.l} onClose={() => setEditK(null)}>
        <div className="space-y-3">
          <label className="block"><span className="text-[13px] text-slate-600">Valor actual</span><NumCell v={data.ind[editK]} w="w-full !h-12 !text-base" onCommit={(v) => {
            if (editK === 'umaD') patch((x) => ({ ind: { ...x.ind, umaD: v, umaM: Math.round(v * DIAS_MES * 100) / 100, umaA: Math.round(v * DIAS_MES * 12 * 100) / 100, umi: v }, indMeta: { ...x.indMeta, umaD: { src: 'manual', at: new Date().toISOString() } } }));
            else patch((x) => ({ ind: { ...x.ind, [editK]: v }, indMeta: { ...x.indMeta, [editK]: { src: 'manual', at: new Date().toISOString() } } }));
            toast('Indicador actualizado');
          }} /></label>
          <p className="text-xs text-slate-500">{eMeta ? (eMeta.src === 'banxico' ? `Banxico · dato del ${eMeta.fecha} · sincronizado ${fmtDT(eMeta.at)}` : `Editado manualmente ${fmtDT(eMeta.at)}`) : 'Valor de referencia incluido en la app.'}{editK === 'umaD' ? ' Al guardar se recalculan UMA mensual, anual y UMI.' : ''}</p>
          <p className="text-[11px] text-slate-400">Escribe el valor y toca fuera del campo para guardarlo.</p>
          <Btn kind="dark" className="w-full" onClick={() => setEditK(null)}>Listo</Btn>
        </div></Sheet>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
